# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.227.4/schema/sveltia-cms.json
backend:
  name: github
  repo: Alpaq92/prowe-website
  branch: main
  # Token only until an OAuth authenticator is deployed: today the
  # "Sign in with GitHub" button goes to api.netlify.com and ends in a 404.
  auth_methods: [token]

site_url: https://alpaq92.github.io/prowe-website/

media_folder: images
public_folder: images

i18n:
  locales: [pl, en]
  default_locale: pl

collections:
  - name: site
    label: Strona
    i18n: true
    files:
      - name: content
        label: Treść strony
        file: content/{{locale}}.json
        format: json
        i18n: true
        fields:
          - { name: title, label: Nazwa, widget: string, i18n: true }
          - { name: headline, label: Nagłówek, widget: text, i18n: true, hint: 'Podgląd linków (LinkedIn, Slack, Facebook) pokazuje stałą kopię nagłówka z index.html i obrazek images/og.png. Po zmianie poproś dewelopera o ich aktualizację.' }
          - { name: intro, label: Wstęp, widget: text, i18n: true }
          - { name: description, label: Opis strony dla wyszukiwarek, widget: text, i18n: true, hint: 'Google czyta ten opis ze strony. Podgląd linków (LinkedIn, Slack, Facebook) pokazuje stałą kopię z index.html. Po zmianie poproś dewelopera o jej aktualizację.' }
          - { name: cta_label, label: Przycisk pod wstępem, widget: string, i18n: true }

          - { name: goals_heading, label: Nagłówek sekcji celów, widget: string, i18n: true }
          - name: goals
            label: Cele
            label_singular: Cel
            widget: list
            i18n: duplicate
            fields:
              - { name: title, label: Tytuł, widget: string, i18n: true }
              - { name: text, label: Opis, widget: text, i18n: true }

          - { name: modules_heading, label: Nagłówek sekcji modułów, widget: string, i18n: true }
          - name: modules
            label: Moduły
            label_singular: Moduł
            widget: list
            i18n: duplicate
            summary: '{{name}}'
            fields:
              - { name: slug, label: Adres (slug), widget: string, i18n: duplicate, pattern: ['^[a-z0-9-]+$', 'Małe litery, cyfry i myślniki'] }
              - { name: name, label: Nazwa, widget: string, i18n: duplicate }
              - name: status
                label: Status
                widget: select
                i18n: duplicate
                default: live
                options:
                  - { label: Dostępny, value: live }
                  - { label: Wkrótce, value: soon }
              - { name: category, label: Kategoria, widget: string, i18n: true }
              - { name: summary, label: Opis skrócony, widget: text, i18n: true }
              - { name: body, label: Opis, widget: markdown, i18n: true, required: false }

          - { name: stack_heading, label: Nagłówek sekcji technologii, widget: string, i18n: true }
          - name: stack
            label: Technologia
            label_singular: Wiersz
            widget: list
            i18n: duplicate
            fields:
              - { name: label, label: Etykieta, widget: string, i18n: true }
              - { name: value, label: Wartość, widget: string, i18n: true }

          - { name: soon_label, label: Etykieta „wkrótce”, widget: string, i18n: true }
          - { name: back_label, label: Link powrotny, widget: string, i18n: true }
          - { name: theme_system, label: Przełącznik motywu — systemowy, widget: string, i18n: true }
          - { name: theme_light, label: Przełącznik motywu — jasny, widget: string, i18n: true }
          - { name: theme_dark, label: Przełącznik motywu — ciemny, widget: string, i18n: true }
          - { name: footer, label: Stopka, widget: string, i18n: true }

          - name: legal
            label: Informacje prawne
            widget: object
            i18n: true
            fields:
              - { name: link_label, label: Link w stopce, widget: string, i18n: true }
              - { name: title, label: Tytuł strony, widget: string, i18n: true }
              # Operator fields are optional on purpose: while the operator is unknown, a required
              # field would block saving every other content change. The page and its footer link
              # appear only once name, address and email are all filled in.
              - name: operator_name
                label: 'Podmiot: nazwa (firma)'
                widget: string
                i18n: duplicate
                required: false
                hint: 'Pełna nazwa z KRS albo CEIDG z formą prawną, np. „Prowe sp. z o.o.”. Strona prawna i link w stopce pojawią się, gdy nazwa, adres i e-mail będą wypełnione.'
              - name: operator_address
                label: 'Podmiot: siedziba i adres'
                widget: string
                i18n: duplicate
                required: false
                hint: 'Siedziba i adres z KRS albo adres działalności z CEIDG.'
              - name: operator_email
                label: 'Podmiot: e-mail'
                widget: string
                i18n: duplicate
                required: false
                hint: 'Obsługiwana skrzynka. Na ten adres przychodzą też żądania z RODO.'
              - name: operator_registry
                label: 'Podmiot: dane rejestrowe'
                widget: string
                i18n: true
                required: false
                hint: 'Jedna linia. Sp. z o.o.: sąd rejestrowy, KRS, NIP, kapitał zakładowy (art. 206 KSH). P.S.A.: sąd rejestrowy, KRS, NIP, aktualny kapitał akcyjny (art. 300⁶¹ KSH). S.A.: sąd rejestrowy, KRS, NIP, kapitał zakładowy i wpłacony (art. 374 KSH). JDG: NIP. Jeśli dotyczy: spółka z grupy spółek dopisuje oznaczenie grupy (pkt 5 tych przepisów), a sp. z o.o. założona przez S24, do czasu pokrycia kapitału, także informację, że wymagane wkłady na kapitał zakładowy nie zostały wniesione (art. 206 § 1 pkt 4 KSH).'
              - name: body
                label: Treść
                widget: markdown
                i18n: true
                hint: 'Wstawki {operator_name}, {operator_address}, {operator_email} i {operator_registry} strona zastępuje danymi z pól powyżej.'
