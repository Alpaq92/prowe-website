<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prowe — platforma modułów dla kancelarii i działów prawnych, działająca na Twoim serwerze." />
    <title>Prowe</title>
    <script>
      // Before first paint, so a dark visitor never sees a white flash.
      try {
        const t = localStorage.getItem('prowe-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div class="wrap top-inner">
        <a class="brand" href="./"><span class="mark" aria-hidden="true">P</span>Prowe</a>
        <nav class="nav" id="nav"></nav>
        <div class="controls">
          <div class="theme" role="group" id="theme-switch">
            <button type="button" data-value="system">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
            </button>
            <button type="button" data-value="light">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
            </button>
            <button type="button" data-value="dark">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
            </button>
          </div>
          <a id="lang-switch" class="lang"></a>
        </div>
      </div>
    </header>
    <main id="app" class="wrap"></main>
    <footer class="wrap" id="footer"></footer>
  </body>
</html>
